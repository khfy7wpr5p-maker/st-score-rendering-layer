name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install pinned Playwright WebKit and system dependencies
        run: npx playwright install --with-deps webkit
      - name: Typecheck, build and unit tests
        run: npm run check
      - name: R3-R5 real Chromium browser gates
        run: npm run test:browser
      - name: SRL-EB-07 WebKit feasibility gate
        run: npm run test:webkit
      - name: R6 headless visual-regression gate
        run: npm run test:headless
      - name: Export Student App browser runtime
        env:
          ST_SCORE_RENDERER_SOURCE_REVISION: 78eec1d958923e871b5069f5026eed9e4ead2c33
        run: npm run export:browser-runtime
      - name: Upload Student App browser runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: student-browser-runtime
          path: dist/browser-runtime
          if-no-files-found: error
          retention-days: 1
      - name: Upload generated lockfile for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: ignore
          retention-days: 3
