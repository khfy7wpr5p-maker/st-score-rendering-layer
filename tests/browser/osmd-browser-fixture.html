<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>R3 OSMD browser fixture</title>
  <style>body{margin:0}#score{width:960px}</style>
</head>
<body>
  <div id="score"></div>
  <div id="status" data-render-pass="false">R3_PENDING</div>
  <script src="../../node_modules/opensheetmusicdisplay/build/opensheetmusicdisplay.min.js"></script>
  <script>
    const xml = `<?xml version="1.0" encoding="UTF-8"?>
<score-partwise version="3.1">
  <work><work-title>R3 Fixture</work-title></work>
  <part-list>
    <score-part id="P1"><part-name>Piano</part-name></score-part>
  </part-list>
  <part id="P1">
    <measure number="1">
      <attributes>
        <divisions>1</divisions>
        <key><fifths>0</fifths></key>
        <time><beats>4</beats><beat-type>4</beat-type></time>
        <clef><sign>G</sign><line>2</line></clef>
      </attributes>
      <note>
        <pitch><step>C</step><octave>4</octave></pitch>
        <duration>1</duration><type>quarter</type>
      </note>
      <note><rest/><duration>3</duration><type>half</type><dot/></note>
    </measure>
  </part>
</score-partwise>`;

    (async () => {
      const status = document.getElementById("status");
      try {
        if (!window.opensheetmusicdisplay?.OpenSheetMusicDisplay) {
          throw new Error("OSMD browser global is unavailable");
        }
        const osmd = new window.opensheetmusicdisplay.OpenSheetMusicDisplay("score", {
          autoResize: false,
          backend: "svg",
          drawTitle: false,
          drawComposer: false,
        });
        await osmd.load(xml);
        osmd.render();
        const svg = document.querySelector("#score svg");
        if (!svg || svg.querySelectorAll("path,g,text").length === 0) {
          throw new Error("OSMD produced no non-empty SVG score");
        }
        status.dataset.renderPass = "true";
        status.textContent = "R3_PASS";
      } catch (error) {
        status.dataset.renderPass = "false";
        status.dataset.renderError = String(error?.message ?? error);
        status.textContent = "R3_FAIL";
      }
    })();
  </script>
</body>
</html>
