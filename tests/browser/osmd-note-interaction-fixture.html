<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>ST note interaction fixture</title><style>body{margin:0}#score{width:720px}#status{position:fixed;right:0;bottom:0}</style></head>
<body>
<div id="score"></div><div id="status" data-render-pass="false" data-stage="boot">NOTE_INTERACTION_PENDING</div>
<script src="../../node_modules/opensheetmusicdisplay/build/opensheetmusicdisplay.min.js"></script>
<script type="importmap">{"imports":{"@st/score-renderer-contracts":"../../packages/contracts/dist/index.js","@st/score-renderer-core":"../../packages/renderer-core/dist/index.js","@st/score-renderer-osmd":"../../packages/adapter-osmd/dist/index.js","opensheetmusicdisplay":"./osmd-module-shim.mjs"}}</script>
<script type="module">
import { SCORE_RENDERER_CONTRACT_VERSION } from "@st/score-renderer-contracts";
import { OsmdRenderer } from "@st/score-renderer-osmd";
import { BrowserScoreHost } from "../../packages/browser-host/dist/index.js";
const xml=`<?xml version="1.0" encoding="UTF-8"?><score-partwise version="3.1"><part-list><score-part id="P1"><part-name>Keyboard</part-name></score-part><score-part id="P2"><part-name>Flute</part-name></score-part></part-list><part id="P1"><measure number="1"><attributes><divisions>1</divisions><time><beats>4</beats><beat-type>4</beat-type></time><staves>2</staves><clef number="1"><sign>G</sign><line>2</line></clef><clef number="2"><sign>F</sign><line>4</line></clef></attributes><note><pitch><step>C</step><octave>4</octave></pitch><duration>1</duration><type>quarter</type><voice>1</voice><staff>1</staff></note><note><chord/><pitch><step>E</step><octave>4</octave></pitch><duration>1</duration><type>quarter</type><voice>1</voice><staff>1</staff></note><note><rest/><duration>3</duration><type>half</type><dot/><voice>1</voice><staff>1</staff></note><backup><duration>4</duration></backup><note><pitch><step>G</step><octave>3</octave></pitch><duration>4</duration><type>whole</type><voice>2</voice><staff>2</staff></note></measure></part><part id="P2"><measure number="1"><attributes><divisions>1</divisions><time><beats>4</beats><beat-type>4</beat-type></time><clef><sign>G</sign><line>2</line></clef></attributes><note><pitch><step>A</step><octave>5</octave></pitch><duration>4</duration><type>whole</type><voice>1</voice></note></measure></part></score-partwise>`;
const status=document.getElementById("status"),score=document.getElementById("score");let adapter;
function stage(value){status.dataset.stage=value}
function sameRef(a,b){return a?.partId===b.partId&&a?.measureIndex===b.measureIndex&&a?.noteIndex===b.noteIndex&&a?.voice===b.voice}
function pointForExactTarget(host,element,expected){if(!(element instanceof Element))throw new Error(`no rendered element for ${JSON.stringify(expected)}`);element.scrollIntoView({block:"center",inline:"center"});const rect=element.getBoundingClientRect();if(!(rect.width>0&&rect.height>0))throw new Error("rendered note has no client rect");for(const fx of [.25,.5,.75])for(const fy of [.25,.5,.75]){const p={clientX:rect.left+rect.width*fx,clientY:rect.top+rect.height*fy};if(sameRef(host.hitTestNote(p),expected))return p}throw new Error(`no exact hit-test point found for ${JSON.stringify(expected)}`)}
async function proveAtWidth(width){stage(`${width}:create`);score.style.width=`${width}px`;let activeAdapter;const host=new BrowserScoreHost(score,{expectedContractVersion:SCORE_RENDERER_CONTRACT_VERSION,rendererFactory(container){activeAdapter=new OsmdRenderer(container);adapter=activeAdapter;return activeAdapter}});stage(`${width}:render`);await host.renderMusicXml(xml,{autoResize:false,drawTitle:false,drawComposer:false},`note-interaction-${width}`);
const chord0={partId:"P1",measureIndex:0,noteIndex:0,voice:1},chord1={partId:"P1",measureIndex:0,noteIndex:1,voice:1},staff2={partId:"P1",measureIndex:0,noteIndex:0,voice:2},part2={partId:"P2",measureIndex:0,noteIndex:0,voice:1};const targets=[chord0,chord1,staff2,part2],elements=targets.map(t=>activeAdapter.resolveRenderedNoteElement(t));stage(`${width}:identity`);if(elements[0]===elements[1])throw new Error("exact chord noteheads were not distinct");for(let i=0;i<targets.length;i++){stage(`${width}:hit-${i}`);pointForExactTarget(host,elements[i],targets[i])}stage(`${width}:repeat-hit`);const chordPoint=pointForExactTarget(host,elements[1],chord1);if(!sameRef(host.hitTestNote(chordPoint),chord1))throw new Error("repeated chord hit-test was not deterministic");stage(`${width}:highlight`);await host.highlight({target:chord1,className:"teacher-focus"});if(elements[1].getAttribute("data-st-score-highlight")!=="true"||!elements[1].classList.contains("teacher-focus"))throw new Error("highlight did not target exact chord notehead");if(elements[0].getAttribute("data-st-score-highlight")==="true")throw new Error("highlight leaked to other chord notehead");stage(`${width}:clear`);await host.clearHighlights();if(elements[1].getAttribute("data-st-score-highlight")!==null||elements[1].classList.contains("teacher-focus"))throw new Error("clearHighlights left renderer-owned state");
stage(`${width}:whitespace`);window.scrollTo(0,0);const sr=score.getBoundingClientRect();if(host.hitTestNote({clientX:sr.left+2,clientY:sr.top+2})!==null)throw new Error("score whitespace produced a note hit");if(host.hitTestNote({clientX:Math.max(0,sr.right+20),clientY:5})!==null)throw new Error("outside coordinates produced a note hit");
stage(`${width}:rerender`);await host.renderMusicXml(xml,{autoResize:false,drawTitle:false,drawComposer:false},`note-interaction-rerender-${width}`);const rerendered=adapter.resolveRenderedNoteElement(chord1);stage(`${width}:rerender-hit`);pointForExactTarget(host,rerendered,chord1);stage(`${width}:dispose`);await host.dispose();stage(`${width}:done`)}
const watchdog=setTimeout(()=>{status.dataset.renderPass="false";status.dataset.renderError=`timeout at ${status.dataset.stage||"unknown"}`;status.textContent="NOTE_INTERACTION_FAIL"},20000);
(async()=>{try{stage("720:start");await proveAtWidth(720);stage("320:start");await proveAtWidth(320);clearTimeout(watchdog);Object.assign(status.dataset,{contractVersion:SCORE_RENDERER_CONTRACT_VERSION,chordExact:"true",multiVoice:"true",multiStaff:"true",multiPart:"true",renderPass:"true",stage:"complete"});status.textContent="NOTE_INTERACTION_PASS"}catch(error){clearTimeout(watchdog);status.dataset.renderPass="false";status.dataset.renderError=String(error?.message??error);status.textContent="NOTE_INTERACTION_FAIL"}})();
</script></body></html>
