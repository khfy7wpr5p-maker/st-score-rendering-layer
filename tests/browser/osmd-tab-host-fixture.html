<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Student pilot TAB through browser host</title>
  <style>body{margin:0}#score{width:390px;min-height:300px}</style>
</head>
<body>
  <div id="score"></div>
  <div id="status" data-render-pass="false">PENDING</div>
  <script src="../../node_modules/opensheetmusicdisplay/build/opensheetmusicdisplay.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "@st/score-renderer-contracts": "../../packages/contracts/dist/index.js",
      "@st/score-renderer-core": "../../packages/renderer-core/dist/index.js",
      "@st/score-renderer-osmd": "../../packages/adapter-osmd/dist/index.js",
      "opensheetmusicdisplay": "./osmd-module-shim.mjs"
    }
  }
  </script>
  <script type="module">
    import { SCORE_RENDERER_CONTRACT_VERSION } from "@st/score-renderer-contracts";
    import { BrowserScoreHost } from "../../packages/browser-host/dist/index.js";

    // Same two-staff, six-line guitar pilot score used by Student App.
    const xml = `<?xml version="1.0" encoding="UTF-8"?>
<score-partwise version="3.1">
  <part-list><score-part id="P1"><part-name>Guitar TAB</part-name></score-part></part-list>
  <part id="P1"><measure number="1"><attributes>
    <divisions>1</divisions><key><fifths>0</fifths></key>
    <time><beats>4</beats><beat-type>4</beat-type></time>
    <staves>2</staves>
    <clef number="1"><sign>G</sign><line>2</line></clef>
    <clef number="2"><sign>TAB</sign><line>5</line></clef>
    <staff-details number="2"><staff-lines>6</staff-lines>
      <staff-tuning line="1"><tuning-step>E</tuning-step><tuning-octave>2</tuning-octave></staff-tuning>
      <staff-tuning line="2"><tuning-step>A</tuning-step><tuning-octave>2</tuning-octave></staff-tuning>
      <staff-tuning line="3"><tuning-step>D</tuning-step><tuning-octave>3</tuning-octave></staff-tuning>
      <staff-tuning line="4"><tuning-step>G</tuning-step><tuning-octave>3</tuning-octave></staff-tuning>
      <staff-tuning line="5"><tuning-step>B</tuning-step><tuning-octave>3</tuning-octave></staff-tuning>
      <staff-tuning line="6"><tuning-step>E</tuning-step><tuning-octave>4</tuning-octave></staff-tuning>
    </staff-details></attributes>
    <note><pitch><step>B</step><octave>4</octave></pitch><duration>2</duration><voice>1</voice><type>half</type><staff>1</staff></note>
    <note><pitch><step>E</step><octave>5</octave></pitch><duration>2</duration><voice>1</voice><type>half</type><staff>1</staff></note>
    <backup><duration>4</duration></backup>
    <note><pitch><step>B</step><octave>4</octave></pitch><duration>2</duration><voice>5</voice><type>half</type><staff>2</staff>
      <notations><technical><string>1</string><fret>7</fret></technical></notations></note>
    <note><pitch><step>E</step><octave>5</octave></pitch><duration>2</duration><voice>5</voice><type>half</type><staff>2</staff>
      <notations><technical><string>1</string><fret>12</fret></technical></notations></note>
  </measure></part>
</score-partwise>`;
    const score = document.getElementById("score");
    const status = document.getElementById("status");
    try {
      const host = new BrowserScoreHost(score, { expectedContractVersion: SCORE_RENDERER_CONTRACT_VERSION });
      await host.renderMusicXml(xml, {
        pageMode: "continuous", autoResize: true, drawTitle: false, drawComposer: false,
      }, "student-pilot-tab");
      const svg = score.querySelector("svg");
      if (!svg || svg.getBoundingClientRect().height <= 0) throw new Error("score SVG is missing or empty");
      const labels = [...svg.querySelectorAll("text")].map((element) => element.textContent?.trim());
      if (!labels.includes("7") || !labels.includes("12")) {
        throw new Error(`TAB frets 7 and 12 missing: ${labels.join(",")}`);
      }
      const fret7 = [...svg.querySelectorAll("text")]
        .find((element) => element.textContent?.trim() === "7");
      if (!fret7) throw new Error("TAB fret 7 SVG text is unavailable");
      const fret7Rect = fret7.getBoundingClientRect();
      const fret7Point = {
        clientX: fret7Rect.left + fret7Rect.width / 2,
        clientY: fret7Rect.top + fret7Rect.height / 2,
      };
      const fret7Hit = host.hitTestNoteDetailed(fret7Point);
      const fret7Lineage = [];
      for (let element = fret7; element && element !== svg; element = element.parentElement) {
        fret7Lineage.push({
          tag: element.tagName,
          id: element.id,
          class: element.getAttribute("class"),
          text: element === fret7 ? element.textContent?.trim() : undefined,
        });
      }
      status.dataset.tabDiagnostics = JSON.stringify({ fret7Hit, fret7Lineage });
      const highlightClass = "student-playback-note";
      status.dataset.stage = "notation-highlight";
      await host.highlight({
        target: { partId: "P1", measureIndex: 0, noteIndex: 0, voice: 1 },
        className: highlightClass,
      });
      status.dataset.stage = "tab-highlight";
      await host.highlight({
        target: { partId: "P1", measureIndex: 0, noteIndex: 0, voice: 5 },
        className: highlightClass,
      });
      const highlighted = [...svg.querySelectorAll('[data-st-score-highlight="true"]')];
      if (highlighted.length !== 2) {
        throw new Error(`Expected simultaneous notation and TAB highlights, got ${highlighted.length}`);
      }
      const tabHighlight = highlighted.find((element) =>
        [element, ...element.querySelectorAll("text")]
          .some((candidate) => candidate.textContent?.trim() === "7"),
      );
      if (!tabHighlight) throw new Error("TAB fret 7 did not receive the playback highlight");
      const notationHighlight = highlighted.find((element) => element !== tabHighlight);
      if (!notationHighlight || notationHighlight.querySelector("text") !== null) {
        throw new Error("Notation staff note did not receive its independent playback highlight");
      }
      for (const element of highlighted) {
        if (!element.classList.contains(highlightClass)) {
          throw new Error("Playback highlight class is missing from a rendered target");
        }
        if (element.getAttribute("fill") !== "#ff8c00" || element.getAttribute("stroke") !== "#ff8c00") {
          throw new Error("Rendered target did not receive the orange playback color");
        }
      }
      await host.clearHighlights();
      if (svg.querySelector('[data-st-score-highlight="true"]') !== null) {
        throw new Error("Playback highlight clearing left stale notation or TAB state");
      }
      status.dataset.renderPass = "true";
      status.textContent = "PILOT_TAB_PASS";
    } catch (error) {
      const diagnostics = status.dataset.tabDiagnostics ?? "unavailable";
      status.dataset.renderError = `${String(error?.message ?? error)}; diagnostics=${diagnostics}`;
      status.textContent = "PILOT_TAB_FAIL";
    }
  </script>
</body>
</html>
